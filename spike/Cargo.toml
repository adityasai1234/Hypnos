[package]
name = "spike"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
wasmtime = { version = "=49.0.2", features = ["call-hook", "all-arch"] }
wasmtime-wasi = "=49.0.2"
